{% set name = "uvicorn" %}
{% set version = "0.52.4" %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  url: https://github.com/encode/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: 6375bb3d46cd202ca25694b86ae5bd12724c842fedd2da235926bd2394018577

build:
  number: 0
  skip: true  # [py<310]

requirements:
  host:
    - python

outputs:
  - name: {{ name }}
    script: uvicorn_build.bat  # [win]
    script: uvicorn_build.sh  # [not win]
    build:
      skip: true  # [py<39]
      entry_points:
        - uvicorn = uvicorn.main:main
    requirements:
      host:
        - python
        - pip
        - hatchling
      run:
        - python
        - click >=7.0
        - h11 >=0.8
        - typing_extensions >=4.0  # [py<311]
      run_constrained:
        - httptools >=0.8.0
        - python-dotenv >=0.13
        - pyyaml >=5.1
        - uvloop >=0.15.1  # [not win]
        - watchfiles >=0.20
        - websockets >=13.0

    test:
      imports:
        - uvicorn
        - uvicorn
        - uvicorn._subprocess
        - uvicorn._types
        - uvicorn.config
        - uvicorn.importer
        - uvicorn.lifespan.off
        - uvicorn.lifespan.on
        - uvicorn.logging
        - uvicorn.loops.auto
        - uvicorn.main
        - uvicorn.middleware
        - uvicorn.middleware.asgi2
        - uvicorn.middleware.proxy_headers
        - uvicorn.middleware.wsgi
        - uvicorn.protocols.http.auto
        - uvicorn.protocols.http.flow_control
        - uvicorn.protocols.http.h11_impl
        - uvicorn.protocols.utils
        - uvicorn.protocols.websockets.auto
        - uvicorn.server
        - uvicorn.supervisors
        - uvicorn.supervisors.basereload
        - uvicorn.supervisors.multiprocess
        - uvicorn.supervisors.statreload
      requires:
        - pip
      commands:
        - pip check
        - uvicorn --help

  - name: {{ name }}-standard
    build:
      skip: true  # [py<39]
    requirements:
      host:
        - python
        - pip
        - {{ pin_subpackage('uvicorn', exact=True) }}
      run:
        - python
        - {{ pin_subpackage('uvicorn', exact=True) }}
        - colorama >=0.4  # [win]
        - httptools >=0.6.3
        - python-dotenv >=0.13
        - pyyaml >=5.1
        - uvloop >=0.14.0,!=0.15.0,!=0.15.1  # [not win]
        - watchfiles >=0.13
        - websockets >=10.4
    # >       from websockets.server import ServerProtocol
    # E       ImportError: cannot import name 'ServerProtocol' from 'websockets.server'
    # https://github.com/python-websockets/websockets/blob/13.1/src/websockets/server.py#L48
    # Needs websockets >=13.1
    # tests/supervisors/test_multiprocess.py and tests/supervisors/test_reload.py are flaky on Windows and MacOS.
    # Exit code 0xC000013A (STATUS_CONTROL_C_EXIT) during pytest-xdist worker teardown, not during actual test execution.
    # The 69% completion shows tests were passing, then cleanup timed out trying to terminate parallel workers.
    # Needs a2wsgi >=1.10.8
    # E   OSError: [Errno 99] error while attempting to bind on address ('::1', 42109, 0, 0): cannot assign requested address
    # E   AssertionError: assert None
    # E    +  where None = _reload_tester(<function touch_soon.<locals>.start at 0x112907430>, <uvicorn.supervisors.watchfilesreload.WatchFilesReload object at 0x11244d220>, PosixPath('/private/var/folders/c_/qfmhj66j0tn016nkx_th4hxm0000gp/T/pytest-of-builder/pytest-923/popen-gw4/reload_directory0/app/sub/sub.py'))
    #      +    where _reload_tester = <tests.supervisors.test_reload.TestBaseReload object at 0x1120d7130>._reload_tester
    # EOFError: Ran out of input
    {% set ignore_tests = "" %}
    {% set ignore_tests = ignore_tests + ' --ignore="tests/protocols/test_websocket.py"' %}
    {% set ignore_tests = ignore_tests + ' --ignore="tests/middleware/test_logging.py"' %}
    {% set ignore_tests = ignore_tests + ' --ignore="tests/middleware/test_message_logger.py"' %}
    {% set ignore_tests = ignore_tests + ' --ignore="tests/supervisors/test_multiprocess.py"' %}  # [not linux]
    {% set ignore_tests = ignore_tests + ' --ignore="tests/supervisors/test_reload.py"' %}  # [not linux]
    {% set ignore_tests = ignore_tests + ' --ignore="tests/middleware/test_wsgi.py"' %}
    {% set tests_to_skip = "" %}
    {% set tests_to_skip = tests_to_skip + " test_http2_upgrade_request " %}
    {% set tests_to_skip = tests_to_skip + " or test_proxy_headers_websocket_x_forwarded_proto " %}
    {% set tests_to_skip = tests_to_skip + " or test_run " %}  # [linux]
    {% set tests_to_skip = tests_to_skip + " or TestBaseReload " %}  # [osx]
    {% set tests_to_skip = tests_to_skip + " or test_multiprocess_health_check " %}  # [linux]
    test:
      source_files:
        - pyproject.toml
        - tests
      imports:
        - uvicorn.supervisors.watchfilesreload
        - uvicorn.middleware.message_logger
        - uvicorn.protocols.http.httptools_impl
        - uvicorn.protocols.websockets.websockets_impl
      requires:
        - pip
        - pytest >=8.3.5
        - pytest-mock >=3.14.0
        - pytest-xdist >=3.6.1
        - wsproto
        - httpx >=0.28.1
        - trustme >=1.2.1
      commands:
        - pip check
        # disable warnings which is treated as errors by pytest
        - pytest -W "ignore::DeprecationWarning:websockets.legacy" -W "ignore::uvicorn.config.UvicornDeprecationWarning" -W "ignore::pytest.PytestUnknownMarkWarning" -vv {{ ignore_tests }} -k "not ({{ tests_to_skip }})"

about:
  home: https://github.com/encode/uvicorn
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.md
  summary: The lightning-fast ASGI server.
  description: |
    Uvicorn is a lightning-fast ASGI server implementation,
    using [uvloop](https://github.com/MagicStack/uvloop) and
    [httptools](https://github.com/MagicStack/httptools).
  doc_url: https://www.uvicorn.org
  dev_url: https://github.com/encode/uvicorn

extra:
  feedstock-name: uvicorn
  recipe-maintainers:
    - carlodri
    - ocefpaf
    - xhochy
